<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>WINNING BD — Admin Panel</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --sidebar:#0f172a; --sidebar-2:#0b1220; --sidebar-text:#94a3b8; --sidebar-active:#f8fafc;
  --bg:#f1f5f9; --card:#ffffff; --border:#e2e8f0; --text:#0f172a; --muted:#64748b;
  --primary:#1976d2; --primary-2:#1565c0; --green:#16a34a; --red:#dc2626; --amber:#d97706;
  --indigo:#4f46e5; --purple:#7c3aed; --blue:#2563eb;
  --radius:12px; --shadow:0 1px 3px rgba(15,23,42,.08), 0 4px 16px rgba(15,23,42,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
a{color:var(--primary);text-decoration:none}
.hidden{display:none!important}

/* ---------- Login ---------- */
#login-view{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(1200px 600px at 20% -10%,#164e8a 0%,#0f172a 55%) #0f172a}
.login-card{width:100%;max-width:420px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:32px 28px}
.login-logo{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.login-logo .logo-badge{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--purple));display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px}
.login-logo h1{font-size:20px;font-weight:900;letter-spacing:.3px}
.login-logo p{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:1px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.input,select.input,textarea.input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:#fff;color:var(--text);outline:none;transition:border-color .15s}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(25,118,210,.12)}
.form-msg{font-size:12px;margin-top:6px}
.form-msg.err{color:var(--red)}
.form-msg.ok{color:var(--green)}
.btn{border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:700;transition:all .15s;display:inline-flex;align-items:center;gap:7px;justify-content:center}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-2)}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{background:#b91c1c}
.btn-ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
.btn-ghost:hover{background:#f8fafc}
.btn-green{background:var(--green);color:#fff}
.btn-green:hover{background:#15803d}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn-block{width:100%}
.icon-btn{background:transparent;border:none;font-size:16px;color:var(--muted);padding:6px;border-radius:8px}
.icon-btn:hover{background:#f1f5f9;color:var(--text)}
.login-foot{margin-top:18px;text-align:center;font-size:12px;color:var(--muted)}
.login-remember{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:16px}
.login-remember input{accent-color:var(--primary)}

/* ---------- App shell ---------- */
.layout{display:flex;min-height:100vh}
.sidebar{width:250px;background:linear-gradient(180deg,var(--sidebar) 0%,var(--sidebar-2) 100%);color:var(--sidebar-text);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:40}
.sidebar-head{padding:18px 18px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(148,163,184,.12)}
.sidebar-head .logo-badge{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--purple));display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;flex-shrink:0}
.sidebar-head .brand-name{font-weight:900;color:#fff;font-size:15px;letter-spacing:.3px}
.sidebar-head .brand-sub{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--sidebar-text)}
.sidebar-nav{flex:1;overflow-y:auto;padding:12px 10px 20px}
.sidebar-nav::-webkit-scrollbar{width:5px}
.sidebar-nav::-webkit-scrollbar-thumb{background:rgba(148,163,184,.25);border-radius:3px}
.nav-group{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1.4px;color:#475569;padding:16px 10px 6px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;font-size:13px;font-weight:600;color:var(--sidebar-text);cursor:pointer;transition:all .13s;width:100%;text-align:left;border:none;background:transparent;margin-bottom:2px}
.nav-item i{width:18px;text-align:center;font-size:14px}
.nav-item:hover{background:rgba(148,163,184,.1);color:#e2e8f0}
.nav-item.active{background:linear-gradient(90deg,rgba(25,118,210,.25),rgba(25,118,210,.06));color:var(--sidebar-active)}
.nav-item.active i{color:#4db3ff}
.sidebar-foot{border-top:1px solid rgba(148,163,184,.12);padding:14px 12px}
.sidebar-user{display:flex;align-items:center;gap:10px;padding:6px;border-radius:10px}
.sidebar-user .avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--purple));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.sidebar-user .nm{color:#e2e8f0;font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-user .rl{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#7c8aa0}

.main{flex:1;margin-left:250px;display:flex;flex-direction:column;min-height:100vh}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:14px 26px;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.topbar .menu-btn{display:none;background:none;border:none;font-size:18px;color:var(--text)}
.topbar h2{font-size:17px;font-weight:800}
.topbar .spacer{flex:1}
.topbar .top-actions{display:flex;gap:6px;align-items:center}
.admin-pill{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border);border-radius:999px;padding:4px 12px 4px 5px}
.admin-pill .avatar{width:26px;height:26px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.admin-pill .nm{font-size:12px;font-weight:700}
.admin-pill .rl{font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.content{padding:24px 26px;flex:1}
.page-title{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.page-title h1{font-size:20px;font-weight:900}
.page-title .sub{font-size:13px;color:var(--muted)}
.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:35}

/* ---------- Components ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card + .card{margin-top:16px}
.card-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.card-title h3{font-size:15px;font-weight:800}
.grid{display:grid;gap:14px}
.grid2{grid-template-columns:repeat(2,1fr)}
.grid3{grid-template-columns:repeat(3,1fr)}
.grid4{grid-template-columns:repeat(4,1fr)}
.card-stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.card-stat .stat-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--muted);display:flex;align-items:center;gap:7px}
.card-stat .stat-label i{width:16px;text-align:center}
.card-stat .stat-value{font-size:26px;font-weight:900;margin-top:6px}
.card-stat .stat-sub{font-size:12px;color:var(--muted);margin-top:4px}
.mini-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.mini-stat{background:#f8fafc;border:1px solid var(--border);border-radius:9px;padding:9px 11px}
.mini-stat .k{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.mini-stat .v{font-size:16px;font-weight:800;margin-top:2px}
.mono{font-variant-numeric:tabular-nums}
.text-green{color:var(--green)} .text-red{color:var(--red)} .text-amber{color:var(--amber)}
.text-indigo{color:var(--indigo)} .text-blue{color:var(--blue)} .text-muted{color:var(--muted)}

.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--card)}
table{width:100%;border-collapse:collapse;min-width:640px}
thead th{background:#f8fafc;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);text-align:left;padding:11px 14px;border-bottom:1px solid var(--border);font-weight:800;white-space:nowrap}
tbody td{padding:11px 14px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#fafbfc}
.row-actions{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.act-icon{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:#fff;color:var(--text);display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.act-icon:hover{border-color:var(--primary);color:var(--primary)}
.act-icon.danger:hover{border-color:var(--red);color:var(--red)}
.act-icon.green{color:var(--green)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap}
.badge.green{background:#dcfce7;color:#15803d}
.badge.red{background:#fee2e2;color:#b91c1c}
.badge.amber{background:#fef3c7;color:#b45309}
.badge.blue{background:#dbeafe;color:#1d4ed8}
.badge.indigo{background:#e0e7ff;color:#4338ca}
.badge.purple{background:#ede9fe;color:#6d28d9}
.badge.gray{background:#f1f5f9;color:#475569}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar .spacer{flex:1}
.select-sm{width:auto;padding:8px 10px;border:1px solid var(--border);border-radius:9px;background:#fff;font-size:13px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{padding:7px 14px;border-radius:9px;border:1px solid var(--border);background:#fff;font-size:12px;font-weight:700;color:var(--muted)}
.tab.active{background:var(--primary);border-color:var(--primary);color:#fff}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.empty i{font-size:34px;display:block;margin-bottom:10px;opacity:.5}
.empty p{font-size:13px}
.skeleton{position:relative;overflow:hidden;background:#eef2f6;border-radius:8px;min-height:16px}
.skeleton::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);animation:shimmer 1.2s infinite}
@keyframes shimmer{100%{transform:translateX(100%)}}
.pagination{display:flex;align-items:center;gap:10px;justify-content:flex-end;margin-top:14px}
.pagination .info{font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;background:#f1f5f9;border:1px solid var(--border);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;cursor:pointer}
.chip:hover{background:#e2e8f0}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.form-grid .full{grid-column:1/-1}
.switch{position:relative;width:42px;height:24px;display:inline-block;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.switch .track{position:absolute;inset:0;background:#cbd5e1;border-radius:999px;transition:background .2s;cursor:pointer}
.switch .track::before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch input:checked + .track{background:var(--green)}
.switch input:checked + .track::before{transform:translateX(18px)}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.switch-row:last-child{border-bottom:none}
.switch-row .k{font-size:13px;font-weight:700}
.switch-row .d{font-size:12px;color:var(--muted);margin-top:2px}
.bar{height:8px;border-radius:99px;background:#eef2f6;overflow:hidden;margin-top:6px}
.bar > div{height:100%;border-radius:99px}
.perm-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:340px;overflow-y:auto}
.perm-item{display:flex;align-items:center;gap:8px;background:#f8fafc;border:1px solid var(--border);border-radius:9px;padding:8px 10px;font-size:12px;font-weight:600}
.perm-item input{accent-color:var(--primary)}
.avatar-big{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,var(--primary),var(--purple));color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900}
.profile-head{display:flex;gap:16px;align-items:center}
.notice{display:flex;gap:10px;align-items:flex-start;background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;border-radius:10px;padding:12px 14px;font-size:13px}
.notice.warn{background:#fffbeb;border-color:#fde68a;color:#92400e}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--muted);font-weight:600}
.kv .v{font-weight:700;text-align:right;word-break:break-all}

/* ---------- Modal ---------- */
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px 16px;overflow-y:auto}
.modal{background:#fff;border-radius:16px;max-width:560px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-lg{max-width:760px}
.modal-xl{max-width:920px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;border-radius:16px 16px 0 0;z-index:2}
.modal-head h3{font-size:16px;font-weight:800}
.modal-body{padding:20px 22px;max-height:calc(100vh - 220px);overflow-y:auto}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid var(--border)}
.monospace-block{background:#0f172a;color:#7dd3fc;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;padding:12px;border-radius:10px;word-break:break-all;margin:10px 0;line-height:1.6}
.curtain{position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.6);backdrop-filter:blur(2px)}

/* ---------- Toast ---------- */
#toast-root{position:fixed;top:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:10px;max-width:340px}
.toast{background:#0f172a;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:13px;font-weight:600;display:flex;gap:10px;align-items:center;animation:toastIn .18s ease}
.toast.ok{border-left:4px solid var(--green)}
.toast.err{border-left:4px solid var(--red)}
.toast.info{border-left:4px solid var(--primary)}
@keyframes toastIn{from{transform:translateY(-12px);opacity:0}to{transform:none;opacity:1}}

@media (max-width:920px){
  .sidebar{transform:translateX(-100%);transition:transform .2s}
  .sidebar.open{transform:none}
  .sidebar-backdrop.show{display:block}
  .main{margin-left:0}
  .topbar .menu-btn{display:inline-flex}
  .content{padding:16px}
  .grid4{grid-template-columns:repeat(2,1fr)}
  .grid3{grid-template-columns:repeat(2,1fr)}
  .grid2{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .admin-pill{display:none}
}
@media (max-width:560px){
  .grid4,.grid3{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="login-view" class="hidden">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-badge"><i class="fa-solid fa-shield-halved"></i></div>
      <div>
        <h1>WINNING BD</h1>
        <p>Admin Panel</p>
      </div>
    </div>
    <div id="login-msg" class="form-msg err" style="margin-bottom:12px"></div>
    <form id="login-form" onsubmit="return App.doLogin(event)">
      <div class="field">
        <label>Admin ID or Gmail</label>
        <input class="input" id="login-credential" autocomplete="username" placeholder="e.g. OWNER01 or admin@domain.com">
      </div>
      <div class="field">
        <label>Password</label>
        <input class="input" id="login-password" type="password" autocomplete="current-password" placeholder="••••••••">
      </div>
      <label class="login-remember"><input type="checkbox" id="login-remember" checked> Remember me on this device</label>
      <button type="submit" class="btn btn-primary btn-block" id="login-btn"><i class="fa-solid fa-right-to-bracket"></i> Sign in</button>
    </form>
    <div class="login-foot">Authorized personnel only · All activity is audited</div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app-view" class="hidden">
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop" onclick="App.closeSidebar()"></div>
    <div class="main">
      <header class="topbar">
        <button class="menu-btn" onclick="App.openSidebar()"><i class="fa-solid fa-bars"></i></button>
        <h2 id="topbar-title">Dashboard</h2>
        <div class="spacer"></div>
        <div class="top-actions">
          <button class="icon-btn" title="Refresh" onclick="App.refresh()"><i class="fa-solid fa-rotate"></i></button>
          <div class="admin-pill">
            <div class="avatar" id="top-avatar">A</div>
            <div>
              <div class="nm" id="top-name">—</div>
              <div class="rl" id="top-role">—</div>
            </div>
          </div>
          <button class="icon-btn" title="Logout" onclick="App.logout()"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
        </div>
      </header>
      <main class="content">
        <div id="content"></div>
      </main>
    </div>
  </div>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
(function () {
  'use strict';

  // ============================================================
  // CONSTANTS & STATE
  // ============================================================
  var API_BASE = window.__API_BASE__ ||
      ((location.protocol.indexOf('http') === 0) ? location.origin + '/api' : 'https://winning-tour-web.vercel.app/api');
  API_BASE = String(API_BASE).replace(/\/+$/, '');

  var ROLE_LEVEL = { OWNER: 3, SUPER_ADMIN: 2, ADMIN: 1 };
  var state = { admin: null, page: 'dashboard', settings: null };
  var listState = {};
  var pendingReauthCb = null;
  var viewData = {};
  var RENDERERS = {};

  // ============================================================
  // SMALL HELPERS
  // ============================================================
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (m) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]; }); }
  function j(v) { return JSON.stringify(v == null ? '' : String(v)); }
  function tk(n) { var x = Number(n) || 0; return '\u09F3' + x.toLocaleString(undefined, { maximumFractionDigits: 2 }); }
  function dt(t) { return t ? new Date(Number(t)).toLocaleString() : '\u2014'; }
  function num(v) { var n = Number(v); return Number.isFinite(n) ? n : 0; }
  function initial(name) { return (name || '?').trim().charAt(0).toUpperCase(); }
  function clsFor(list, value) {
    var map = { PENDING:'amber', MANUAL_REVIEW:'purple', APPROVED:'green', REJECTED:'red',
      PROCESSING:'indigo', COMPLETED:'green', Draft:'gray', Upcoming:'blue', Ongoing:'purple',
      Finished:'green', Cancelled:'red', active:'green', inactive:'gray', suspended:'red',
      CONNECTED:'green', DISABLED:'amber', REVOKED:'red', ACTIVE:'green', MATCHED:'green',
      AMOUNT_MISMATCH:'red', DUPLICATE_TRANSACTION:'amber', UNMATCHED:'gray', ALREADY_APPROVED:'green',
      ALREADY_REJECTED:'red', INVALID_TRANSACTION:'red', EXPIRED_DEPOSIT:'gray', FAILED:'red',
      STORED:'gray', MANUAL:'purple', AUTO:'blue', SPECIFIC:'indigo' };
    return map[value] || 'gray';
  }
  function badge(value, fallbackText) {
    var label = fallbackText || value || '\u2014';
    return '<span class="badge ' + clsFor(value) + '">' + esc(label).replace(/_/g, ' ') + '</span>';
  }
  function toast(message, type) {
    var root = document.getElementById('toast-root');
    var el = document.createElement('div');

    el.innerHTML = '<i class="fa-solid ' + icon + '"></i><span>' + esc(message) + '</span>';
    root.appendChild(el);
    setTimeout(function () { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(function () { el.remove(); }, 320); }, 3400);
  }

  // ============================================================
  // API CLIENT
  // ============================================================
  function getToken() { return window.__ADMIN_TOKEN__ || localStorage.getItem('atk') || sessionStorage.getItem('atk') || ''; }
  function clearToken() { try { localStorage.removeItem('atk'); sessionStorage.removeItem('atk'); } catch (e) {} }

  async function api(path, options) {
    var opts = options || {};
    var headers = { 'Content-Type': 'application/json' };
    var t = getToken();
    if (t) headers['Authorization'] = 'Bearer ' + t;
    var res;
    try { res = await fetch(API_BASE + path, { method: opts.method || 'GET', headers: headers, body: opts.body }); }
    catch (e) { throw new Error('Network error. Please check your connection.'); }
    var json = null;
    try { json = await res.json(); } catch (e) {}
    if (!res.ok || (json && json.success === false)) {
      var message = (json && json.error && json.error.message) || 'Something went wrong.';
      var code = (json && json.error && json.error.code) || 'UNKNOWN';
      if (res.status === 401 && state.admin) {
        clearToken();
        showLogin();
        toast('Session expired. Please sign in again.', 'err');
      }
      var err = new Error(message);
      err.code = code;
      throw err;
    }
    return json ? json.data : null;
  }

  function navigate(page) {
    if (!state.admin) return;

    if (!item || !canView(item)) {

    document.getElementById('sidebar-backdrop').classList.remove('show');

    renderSidebar();

  // ============================================================
  // LOGIN
  // ============================================================
  async function doLogin(e) {
    if (e && e.preventDefault) e.preventDefault();
    var credential = document.getElementById('login-credential').value.trim();
    var password = document.getElementById('login-password').value;
    var msg = document.getElementById('login-msg');
    var btn = document.getElementById('login-btn');
    msg.innerHTML = '';
    if (!credential || !password) { msg.textContent = 'Please provide both credential and password.'; return; }
    btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Signing in...';
    try {
      var res = await api('/admin/auth/login', { method: 'POST', body: JSON.stringify({ credential: credential, password: password }) });
      var token = res.token;
      var remember = document.getElementById('login-remember').checked;
      sessionStorage.setItem('atk', token);
      if (remember) localStorage.setItem('atk', token); else localStorage.removeItem('atk');
      state.admin = res.admin;
      enterApp();
    } catch (err) {
      msg.textContent = err.message || 'Invalid credentials.';
    } finally {
      btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Sign in';
    }
  }

  async function logout() {
    try { await api('/admin/auth/logout', { method: 'POST' }); } catch (e) {}
    clearToken();
    showLogin();
  }

  async function runSearch() {
    var q = document.getElementById('gs-q').value.trim();
    var box = document.getElementById('gs-results');
    if (!q) { box.innerHTML = empty('Enter a search term.'); return; }
    box.innerHTML = '<div class="skeleton" style="height:70px"></div>';
    var queries = [];
    if (can('users.view')) queries.push(api('/admin/users?q=' + encodeURIComponent(q) + '&limit=10'));
    else queries.push(Promise.resolve(null));
    if (can('deposits.view')) queries.push(api('/admin/deposits?q=' + encodeURIComponent(q) + '&limit=10'));
    else queries.push(Promise.resolve(null));
    if (can('withdrawals.view')) queries.push(api('/admin/withdrawals?q=' + encodeURIComponent(q) + '&limit=10'));
    else queries.push(Promise.resolve(null));
    if (can('matches.view')) queries.push(api('/admin/matches?q=' + encodeURIComponent(q) + '&limit=10'));
    else queries.push(Promise.resolve(null));
    if (can('referrals.view')) queries.push(api('/admin/referrals?q=' + encodeURIComponent(q) + '&limit=10'));
    else queries.push(Promise.resolve(null));
    try {
      var r = await Promise.all(queries);
      var html = '';
      var total = 0;

      var users = (r[0] && r[0].items) || [];
      total += users.length;
      html += '<h3 class="text-muted" style="margin:18px 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:1px">Users (' + users.length + ')</h3>';
      if (users.length) html += '<div class="table-wrap"><table><thead><tr><th>UID</th><th>Name</th><th>Contact</th><th>Balance</th><th>Status</th><th></th></tr></thead><tbody>' +
        users.map(function (u) { return '<tr><td class="mono">' + esc(u.uid) + '</td><td>' + esc(u.username) + '</td><td>' + esc(u.phone || u.email || '\u2014') + '</td><td class="mono">' + tk(u.deposit) + ' / ' + tk(u.winning) + '</td><td>' + badge(u.status, u.status) + '</td><td><button class="btn btn-ghost btn-sm" onclick="App.openUser(' + j(u.uid) + ')">View</button></td></tr>'; }).join('') +
        '</tbody></table></div>';
      else if (can('users.view')) html += '<p class="text-muted" style="font-size:13px">No users found.</p>';

      var deps = (r[1] && r[1].items) || [];
      total += deps.length;
      html += '<h3 class="text-muted" style="margin:18px 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:1px">Deposits (' + deps.length + ')</h3>';
      if (deps.length) html += '<div class="table-wrap"><table><thead><tr><th>ID</th><th>Method</th><th>Trx ID</th><th>Amount</th><th>Status</th><th></th></tr></thead><tbody>' +
        deps.map(function (d) { return '<tr><td class="mono">' + esc(d.id) + '</td><td>' + esc(d.paymentMethod) + '</td><td class="mono">' + esc(d.trxId) + '</td><td class="mono">' + tk(d.approvedAmount || d.amount) + '</td><td>' + badge(d.status) + '</td><td><button class="btn btn-ghost btn-sm" onclick="App.openDeposit(' + j(d.id) + ')">View</button></td></tr>'; }).join('') +
        '</tbody></table></div>';
      else if (can('deposits.view')) html += '<p class="text-muted" style="font-size:13px">No deposits found.</p>';

      var wds = (r[2] && r[2].items) || [];
      total += wds.length;
      html += '<h3 class="text-muted" style="margin:18px 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:1px">Withdrawals (' + wds.length + ')</h3>';

    catOrder.splice(i, 1); catOrder.splice(j2, 0, id);

    loadCategoriesFromOrder();

    var idx = viewData.places ? viewData.places.length : 0;

    list.innerHTML = places.map(function (p, i) {

        '<span class="badge blue">' + (i + 1) + '</span>' +

        '<button class="act-icon danger" onclick="App.removePlace(' + i + ')"><i class="fa-solid fa-xmark"></i></button>' +
      '</div>';

  async function savePromo(code) {
    var msg = document.getElementById('pr-msg');
    var startVal = document.getElementById('pr-start').value;
    var endVal = document.getElementById('pr-end').value;
    var payload = {
      rewardType: document.getElementById('pr-type').value,
      reward: parseFloat(document.getElementById('pr-reward').value) || 0,
      minDeposit: parseFloat(document.getElementById('pr-min').value) || 0,
      perUserLimit: parseInt(document.getElementById('pr-peruser').value, 10) || 1,
      usageLimit: parseInt(document.getElementById('pr-usage').value, 10) || 0,
      startDate: startVal ? new Date(startVal).getTime() : 0,
      expiryDate: endVal ? new Date(endVal).getTime() : 0,
      status: document.getElementById('pr-status').value
    };
    if (!payload.reward) { msg.textContent = 'Reward must be greater than zero.'; msg.className = 'form-msg err'; return; }
    try {
      if (code) await api('/admin/promos/' + encodeURIComponent(code), { method: 'PUT', body: JSON.stringify(payload) });

  }

  async function savePaymentSettings() {
    if (!(isSuper() && can('settings.manage'))) { toast('Insufficient permissions.', 'err'); return; }
    var methods = viewData.paymentMethods.map(function (m, i) { return { code: m.code, name: m.name, enabled: document.getElementById('pm-' + i).checked }; });
    var patch = {
      auto_verification_enabled: document.getElementById('s-auto').checked,
      deposits_enabled: document.getElementById('s-depon').checked,
      withdrawals_enabled: document.getElementById('s-wdon').checked,
      payment_methods: methods,
      bkash_number: document.getElementById('s-bkash').value,
      nagad_number: document.getElementById('s-nagad').value,
      rocket_number: document.getElementById('s-rocket').value,
      how_to_add_money_link: document.getElementById('s-howadd').value,
      minimum_deposit: parseFloat(document.getElementById('s-mindep').value) || 0,
      maximum_deposit: parseFloat(document.getElementById('s-maxdep').value) || 0,
      minimum_withdrawal: parseFloat(document.getElementById('s-minwd').value) || 0,
      maximum_withdrawal: parseFloat(document.getElementById('s-maxwd').value) || 0
    };
    withReauth('Save payment settings', async function () {
      try { await api('/admin/settings', { method: 'PUT', body: JSON.stringify(Object.assign({}, state.settings || {}, patch)) }); toast('Payment settings saved.', 'ok'); App.refresh(); }
      catch (e) { var el = document.getElementById('pay-msg'); if (el) { el.textContent = e.message; el.className = 'form-msg err'; } else toast(e.message, 'err'); }
    });
  }

          '<div class="field"><label>Referred bonus (BDT)</label><input class="input" id="st-ref2" type="number" step="any" value="' + num(s.referred_bonus) + '"></div>' +
          '<div class="field"><label>Support link</label><input class="input" id="st-support" value="' + esc(s.support_link || '') + '"></div>' +
          '<div class="field"><label>Support number</label><input class="input" id="st-supportnum" value="' + esc(s.support_number || '') + '"></div>' +
          '<div class="field"><label>How to play link</label><input class="input" id="st-howplay" value="' + esc(s.how_to_play_link || '') + '"></div>' +
          '<div class="field"><label>How to get room ID link</label><input class="input" id="st-roomlink" value="' + esc(s.how_to_get_room_id_link || '') + '"></div>' +
          '<div class="field"><label>Announcement</label><textarea class="input" id="st-ann" rows="2">' + esc(s.announcement || '') + '</textarea></div>' +
          '<div class="field"><label>Notice</label><textarea class="input" id="st-notice" rows="2">' + esc(s.notice || '') + '</textarea></div>' +
          '<div class="field full"><label>Popup notice title</label><input class="input" id="st-pop-title" value="' + esc(popup.title || '') + '"></div>' +
          '<div class="field full"><label>Popup notice body</label><textarea class="input" id="st-pop-body" rows="3">' + esc(popup.body || '') + '</textarea></div>' +
          '<div class="field full switch-row" style="border:none;padding:4px 0"><div><div class="k">Popup notice enabled</div><div class="d">Show popup to users on open</div></div><label class="switch"><input type="checkbox" id="st-pop-en" ' + (popup.enabled ? 'checked' : '') + '><span class="track"></span></label></div>' +
          '<div class="field full switch-row" style="border:none;padding:4px 0"><div><div class="k">Registration open</div></div><label class="switch"><input type="checkbox" id="st-reg" ' + (s.registration_enabled !== false ? 'checked' : '') + '><span class="track"></span></label></div>' +
        '</div>' +
        '<div id="st-msg" class="form-msg" style="margin-top:10px"></div>' +
        '<div class="modal-foot" style="padding:14px 0 0;border:none">' +
          (canSave ? '<button class="btn btn-primary" onclick="App.saveAppSettings()"><i class="fa-solid fa-floppy-disk"></i> Save settings</button>' : '') +
          '<button class="btn btn-ghost" onclick="App.refresh()"><i class="fa-solid fa-rotate"></i> Reload</button>' +
        '</div>' +
      '</div>';
  }
  async function saveAppSettings() {
    if (!(isSuper() && can('settings.manage'))) { toast('Insufficient permissions.', 'err'); return; }
    var patch = {
      app_name: document.getElementById('st-name').value,
      announcement: document.getElementById('st-ann').value,
      notice: document.getElementById('st-notice').value,
      popupNotice: {
        title: document.getElementById('st-pop-title').value,
        body: document.getElementById('st-pop-body').value,
        enabled: document.getElementById('st-pop-en').checked
      },
      registration_enabled: document.getElementById('st-reg').checked,
      referral_bonus: parseFloat(document.getElementById('st-refbonus').value) || 0,
      referred_bonus: parseFloat(document.getElementById('st-ref2').value) || 0,
      support_link: document.getElementById('st-support').value,
      support_number: document.getElementById('st-supportnum').value,
      how_to_play_link: document.getElementById('st-howplay').value,
      how_to_get_room_id_link: document.getElementById('st-roomlink').value
    };
    withReauth('Save app settings', async function () {
      try { await api('/admin/settings', { method: 'PUT', body: JSON.stringify(Object.assign({}, state.settings || {}, patch)) }); toast('Settings saved.', 'ok'); App.refresh(); }
      catch (e) { var el = document.getElementById('st-msg'); if (el) { el.textContent = e.message; el.className = 'form-msg err'; } else toast(e.message, 'err'); }
    });
  }

  // ============================================================
  // MAINTENANCE
  // ============================================================
  RENDERERS.maintenance = function (content) {
    content.innerHTML =
      '<div class="page-title"><div><h1>Maintenance</h1><div class="sub">Put the User App into maintenance mode</div></div></div>' +
      '<div id="maint-box"><div class="card"><div class="skeleton" style="height:120px"></div></div></div>';
    loadMaintenance();
  };
  async function loadMaintenance() {
    var box = document.getElementById('maint-box');
    if (!box) return;
    var r;
    try { r = await api('/admin/settings'); }
    catch (e) { box.innerHTML = '<div class="card"><div class="form-msg err">' + esc(e.message) + '</div></div>'; return; }
    var s = r.settings || {};
    var on = s.maintenance_mode === true;
    var canSave = isSuper() && can('settings.manage');
    box.innerHTML = '<div class="card">' +
      '<div class="notice ' + (on ? 'warn' : '') + '" style="margin-bottom:16px"><i class="fa-solid fa-circle-info" style="margin-top:2px"></i><div>Maintenance is currently <strong>' + (on ? 'ACTIVE' : 'OFF') + '</strong>. While active, the User App shows the maintenance screen.</div></div>' +
      '<div class="switch-row"><div><div class="k">Maintenance mode</div><div class="d">Broadcast a maintenance notice to all users</div></div><label class="switch"><input type="checkbox" id="mt-switch" ' + (on ? 'checked' : '') + ' ' + (canSave ? '' : 'disabled') + '><span class="track"></span></label></div>' +
      (canSave ? '<button class="btn ' + (on ? 'btn-ghost' : 'btn-danger') + '" style="margin-top:14px" onclick="App.saveMaintenance()"><i class="fa-solid fa-' + (on ? 'circle-check' : 'triangle-exclamation') + '"></i> ' + (on ? 'Turn off maintenance' : 'Turn on maintenance') + '</button>' : '<p class="text-muted" style="font-size:12px;margin-top:10px">Requires SUPER_ADMIN + settings.manage.</p>') +
      '</div>';
  }
  function saveMaintenance() {
    var r;
    try { r = api('/admin/settings').then(function () {}); } catch (e) {}
    var s = state.settings || {};
    var enabled = !(s.maintenance_mode === true);
    withReauth(enabled ? 'Enable maintenance' : 'Disable maintenance', async function () {
      try { await api('/admin/settings/maintenance', { method: 'POST', body: JSON.stringify({ enabled: enabled }) }); toast(enabled ? 'Maintenance ON.' : 'Maintenance OFF.', 'ok'); App.refresh(); }
      catch (e) { toast(e.message, 'err'); }
    });
  }

  // ============================================================
  // PROFILE
  // ============================================================
  RENDERERS.profile = function (content) {
    var a = state.admin;
    var perms = Object.keys(a.permissions || {}).filter(function (k) { return a.permissions[k] === true; });
    content.innerHTML =
      '<div class="page-title"><div><h1>My Profile</h1><div class="sub">Account information &amp; permissions</div></div></div>' +
      '<div class="card"><div class="profile-head">' +
        '<div class="avatar-big">' + esc(initial(a.name || a.adminId)) + '</div>' +
        '<div><h2 style="font-size:20px;font-weight:900">' + esc(a.name || a.adminId) + '</h2>' +
          '<div style="margin-top:6px">' + badge(a.role) + ' ' + badge(a.status) + '</div>' +
          '<div class="text-muted" style="font-size:13px;margin-top:6px">' + esc(a.email || '') + ' · ' + esc(a.adminId) + ' · joined ' + dt(a.createdAt) + '</div></div>' +
      '</div></div>' +
      '<div class="grid grid2" style="margin-top:14px">' +
        '<div class="card"><div class="card-title"><h3>Permissions</h3></div>' +
          '<div style="display:flex;flex-wrap:wrap;gap:6px">' + (perms.length ? perms.map(function (p) { return '<span class="badge blue">' + esc(p.replace(/_/g, ' ')) + '</span>'; }).join('') : '<p class="text-muted" style="font-size:13px">No explicit permissions (permission lookup sections will be unavailable).</p>') + '</div>' +
        '</div>' +
        '<div class="card"><div class="card-title"><h3>Account security</h3></div>' +
          '<div class="row-actions">' +
            '<button class="btn btn-ghost btn-sm" onclick="App.changePassword()"><i class="fa-solid fa-key"></i> Change password</button>' +
            '<button class="btn btn-ghost btn-sm" onclick="App.generateMyRecoveryCode()"><i class="fa-solid fa-shield-halved"></i> Security code</button>' +
            '<button class="btn btn-ghost btn-sm" onclick="App.logoutAllSessions()"><i class="fa-solid fa-right-from-bracket"></i> Sign out everywhere else</button>' +
          '</div>' +
        '</div>' +
      '</div>';
  };

  // ============================================================
  // PAGINATION DISPATCH
  // ============================================================
  function pageNav(pageName, pg) {
    if (pageName === 'users') loadUsers(pg);
    else if (pageName === 'deposits') loadDeposits(pg);
    else if (pageName === 'withdrawals') loadWithdrawals(pg);
    else if (pageName === 'matches') loadMatches(pg);
    else if (pageName === 'referrals') loadReferrals(pg);
    else if (pageName === 'notifications') loadNotifications(pg);
    else if (pageName === 'sms') loadSmsTx(pg);
    else if (pageName === 'audit') loadAudit(pg);
  }

  // ============================================================
  // PAGE REGISTRY & EXPORTS
  // ============================================================

  // Public API surface used by inline handlers.
  var App = {
    doLogin: doLogin,
    navigate: navigate,
    logout: logout,
    refresh: function () { render(); },
    closeModal: closeModal,
    doReauth: function () {
      var p = document.getElementById('reauth-pass');
      var msg = document.getElementById('reauth-msg');
      if (!p || !p.value) { if (msg) { msg.textContent = 'Password required.'; msg.className = 'form-msg err'; } return; }
      api('/admin/security/verify-password', { method: 'POST', body: JSON.stringify({ password: p.value }) })
        .then(function () {
          closeModal();
          var cb = pendingReauthCb;
          pendingReauthCb = null;
          if (cb) cb();
        })
        .catch(function (e) { if (msg) { msg.textContent = e.message; msg.className = 'form-msg err'; } });
    },
    openSidebar: function () { document.getElementById('sidebar').classList.add('open'); document.getElementById('sidebar-backdrop').classList.add('show'); },
    closeSidebar: function () { document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebar-backdrop').classList.remove('show'); },
    page: pageNav,

    runSearch: runSearch,
    loadUsers: loadUsers, openUser: openUser, suspendUser: suspendUser, unsuspendUser: unsuspendUser, addNote: addNote,
    lookupWallet: lookupWallet, adjustWallet: adjustWallet, doAdjustWallet: doAdjustWallet,
    loadCategories: loadCategories, newCategory: newCategory, editCategory: editCategory, saveCategory: saveCategory,
    toggleCategory: toggleCategory, deleteCategory: deleteCategory, moveCategory: moveCategory, saveCategoryOrder: saveCategoryOrder,
    loadMatches: loadMatches, openMatch: openMatch, newMatch: newMatch, editMatch: editMatch, saveMatch: saveMatch,
    cancelMatch: cancelMatch, deleteMatch: deleteMatch, finalizeMatch: finalizeMatch, saveFinalize: saveFinalize,
    addPlacement: addPlacement, fillFinalize: fillFinalize, setPlacePrize: setPlacePrize, removePlace: removePlace,
    loadReferrals: loadReferrals, claimReferral: claimReferral,
    loadPromos: loadPromos, newPromo: newPromo, editPromo: editPromo, savePromo: savePromo, togglePromo: togglePromo, deletePromo: deletePromo,
    loadDeposits: loadDeposits, openDeposit: openDeposit, approveDeposit: approveDeposit, rejectDeposit: rejectDeposit,
    markManualReview: markManualReview, addDepositNote: addDepositNote,
    loadWithdrawals: loadWithdrawals, openWithdrawal: openWithdrawal, approveWithdrawal: approveWithdrawal,
    rejectWithdrawal: rejectWithdrawal, processWithdrawal: processWithdrawal, completeWithdrawal: completeWithdrawal,
    loadNotifications: loadNotifications, newNotification: newNotification, sendNotification: sendNotification, deleteNotification: deleteNotification,
    loadBanners: loadBanners, newBanner: newBanner, editBanner: editBanner, saveBanner: saveBanner, deleteBanner: deleteBanner,
    moveBanner: moveBanner, saveBannerOrder: saveBannerOrder,
    runReport: loadReport,
    loadAdmins: loadAdmins, newAdmin: newAdmin, editAdmin: editAdmin, saveAdmin: saveAdmin, editPermissions: editPermissions,
    selectAllPerms: selectAllPerms, savePermissions: savePermissions, toggleAdminStatus: toggleAdminStatus,
    recoveryCode: recoveryCode, deleteAdmin: deleteAdmin,
    loadDevices: loadDevices,
    loadSms: loadSms, smsFilter: function () { loadSmsTx(1); }, registerDevice: registerDevice, doRegisterDevice: doRegisterDevice,
    copyCreds: copyCreds, setDeviceStatus: setDeviceStatus, revokeDevice: revokeDevice,
    loadAudit: loadAudit,
    loadMaintenance: loadMaintenance, saveMaintenance: saveMaintenance,
    loadSettings: loadSettings, saveAppSettings: saveAppSettings, loadPaymentSettings: loadPaymentSettings, savePaymentSettings: savePaymentSettings,
    loadSecurity: loadSecurity, logoutAllSessions: logoutAllSessions, changePassword: changePassword, doChangePassword: doChangePassword,
    verifyPasswordSelf: verifyPasswordSelf, generateMyRecoveryCode: generateMyRecoveryCode
  };
  window.App = App;

  window.addEventListener('hashchange', function () { if (state.admin) navigate(location.hash.replace('#/', '') || 'dashboard'); });
  document.addEventListener('DOMContentLoaded', function () { init(); });
  if (document.readyState !== 'loading') init();
})();
</script>
</body>
</html>
